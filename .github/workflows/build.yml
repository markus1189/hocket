name: "Build package"
on:
  push:
    branches: ["master"]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - run: nix build
  e2e:
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - run: nix build
    # No TTY needed: tmux gives each pane its own PTY. vty needs terminfo for
    # the pane's TERM (tmux-256color), which the runner image may lack, so it
    # comes from nixpkgs. e2e.sh deletes its temp dir on exit and prints
    # diffs and the pane's screen on failure, so the log holds everything.
    - name: End-to-end scenarios
      run: |
        TERMINFO_DIRS="$(nix build --no-link --print-out-paths nixpkgs#ncurses)/share/terminfo"
        export TERMINFO_DIRS
        HOCKET="$(nix path-info .)/bin/hocket" test/e2e.sh
